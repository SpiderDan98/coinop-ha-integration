load:
  name: Load Scenario
  description: >-
    Replaces everything Coin-op holds by a Scenario of test data: a Preset, or the
    Pieces picked.
  fields:
    preset:
      name: Preset
      selector:
        select:
          options:
            - empty
            - quick-start
            - few-runs
            - printing-now
            - two-printers
            - long-history
            - washing-machine
            - irrigation
    pieces:
      name: Pieces
      selector:
        select:
          multiple: true
          options:
            - prusa
            - bambu
            - anycubic.3d_printer
            - anycubic_cloud.3d_printer
            - bambu_lab.3d_printer
            - prusalink.3d_printer
            - octoprint.3d_printer
            - ha_creality_ws.3d_printer
            - elegoo_printer.3d_printer
            - moonraker.3d_printer
            - washer
            - ha_washdata.washing_machine
            - dishwasher
            - ha_washdata.dishwasher
            - dryer
            - tesla_wall_connector.ev_charger
            - evcc_intg.ev_charger
            - ocpp.ev_charger
            - easee.ev_charger
            - zaptec.ev_charger
            - goecharger_mqtt.ev_charger
            - goecharger_api2.ev_charger
            - wallbox.ev_charger
            - irrigation
    history:
      name: History
      description: How much history the Devices with history get.
      default: short
      selector:
        select:
          options:
            - none
            - short
            - long
    open_run:
      name: Open Run
      description: Whether each Device with history gets an open Run, which its helpers end.
      default: false
      selector:
        boolean:
