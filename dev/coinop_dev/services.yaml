load:
  name: Load Scenario
  description: >-
    Replaces everything Coin-op holds by a Scenario of test data: a Preset, or the
    Pieces picked.
  fields:
    preset:
      name: Preset
      selector:
        select:
          options:
            - empty
            - quick-start
            - few-runs
            - printing-now
            - two-printers
            - long-history
            - washing-machine
            - irrigation
    pieces:
      name: Pieces
      selector:
        select:
          multiple: true
          options:
            - prusa
            - bambu
            - anycubic.3d_printer
            - anycubic_cloud.3d_printer
            - bambu_lab.3d_printer
            - prusalink.3d_printer
            - octoprint.3d_printer
            - ha_creality_ws.3d_printer
            - elegoo_printer.3d_printer
            - moonraker.3d_printer
            - washer
            - ha_washdata.washing_machine
            - miele.washing_machine
            - home_connect.washing_machine
            - ha_washdata.dishwasher
            - miele.dishwasher
            - home_connect.dishwasher
            - miele.tumble_dryer
            - home_connect.tumble_dryer
            - miele.coffee_machine
            - home_connect.coffee_machine
            - miele.oven
            - home_connect.oven
            - tesla_wall_connector.ev_charger
            - irrigation
