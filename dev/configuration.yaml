# The dev container's configuration (scripts/devenv.py); not for a real Home Assistant.
default_config:

homeassistant:
  name: CoinOp dev
  # The host's time zone, which scripts/devenv.py hands over.
  time_zone: !env_var TZ UTC
  currency: EUR
  unit_system: metric
  auth_providers:
    # Logs the browser in without a password; the port is bound to localhost only.
    - type: trusted_networks
      trusted_networks:
        - 0.0.0.0/0
        - ::/0
      allow_bypass_login: true
    - type: homeassistant

logger:
  default: warning
  logs:
    custom_components.coinop: debug

coinop_dev:

# The Devices' inputs; the Scenarios refer to them by these ids.
input_select:
  prusa_status:
    name: Prusa MK4 status
    options: [idle, printing, paused, finished, cancelled, error]
  bambu_status:
    name: Bambu Lab X1C status
    options: [idle, printing, paused, finished, cancelled, error]
  washer_status:
    name: Washing machine status
    options: ["off", running, paused, finished, cancelled]
  washer_program:
    name: Washing machine program
    options: ["Cotton 60°", "Eco 40-60", Wool, Quick 30]

input_text:
  prusa_job:
    name: Prusa MK4 job
  bambu_job:
    name: Bambu Lab X1C job

input_number:
  washer_energy:
    name: Washing machine energy
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  washer_water:
    name: Washing machine water
    min: 0
    max: 1000000
    step: 0.1
    mode: box
    unit_of_measurement: L
  detergent_scale:
    name: Detergent scale
    min: 0
    max: 5000
    step: 1
    mode: box
    unit_of_measurement: g
