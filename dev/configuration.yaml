# The dev container's configuration (scripts/devenv.py); not for a real Home Assistant.
default_config:

homeassistant:
  name: CoinOp dev
  # The host's time zone, which scripts/devenv.py hands over.
  time_zone: !env_var TZ UTC
  currency: EUR
  unit_system: metric
  auth_providers:
    # Logs the browser in without a password; the port is bound to localhost only.
    - type: trusted_networks
      trusted_networks:
        - 0.0.0.0/0
        - ::/0
      allow_bypass_login: true
    - type: homeassistant

logger:
  default: warning
  logs:
    custom_components.coinop: debug

coinop_dev:

# The Devices' inputs; the Scenarios refer to them by these ids.
input_select:
  prusa_status:
    name: Prusa MK4 status
    options: [idle, printing, paused, finished, cancelled, error]
  bambu_status:
    name: Bambu Lab X1C status
    options: [idle, printing, paused, finished, cancelled, error]
  # hass-anycubic's job states, for the stand-in in dev/anycubic_cloud.
  kobra_status:
    name: Kobra S1 status
    options: [idle, printing, paused, finished, cancelled]
  # Klipper's print states, for the Moonraker stand-in in dev/moonraker.
  voron_status:
    name: Voron 2.4 print state
    options: [standby, printing, paused, complete, cancelled, error]
  washer_status:
    name: Washing machine status
    options: ["off", running, paused, finished, cancelled]
  washer_program:
    name: Washing machine program
    options: ["Cotton 60°", "Eco 40-60", Wool, Quick 30]
  dishwasher_status:
    name: Dishwasher status
    options: ["off", running, paused, finished, cancelled]
  dishwasher_program:
    name: Dishwasher program
    options: ["Eco 50°", "Auto 45-65°", "Intensive 70°", "Quick 45°"]
  kitchen_oven_status:
    name: Kitchen oven status
    options: ["off", running, paused, finished, cancelled]
  kitchen_oven_program:
    name: Kitchen oven program
    options: ["Fan plus 180°", "Top/bottom heat 200°", Grill, "Pizza 220°"]
  carport_charger_status:
    name: Carport charger status
    options: [disconnected, connected, charging, error]
  irrigation_status:
    name: Garden valve status
    options: ["off", watering]
  # The Tesla Wall Connector's states, for the stand-in in dev/tesla_wall_connector.
  wall_connector_status:
    name: Wall Connector status
    options: [not_connected, connected, charging, waiting_car, charging_finished, error]

input_text:
  prusa_job:
    name: Prusa MK4 job
  bambu_job:
    name: Bambu Lab X1C job
  kobra_job:
    name: Kobra S1 job
  voron_job:
    name: Voron 2.4 file

input_number:
  kobra_power:
    name: Kobra S1 power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W
  voron_power:
    name: Voron 2.4 power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W
  voron_filament:
    name: Voron 2.4 filament used
    min: 0
    max: 10000
    step: 0.01
    mode: box
    unit_of_measurement: m
  washer_energy:
    name: Washing machine energy
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  washer_water:
    name: Washing machine water
    min: 0
    max: 1000000
    step: 0.1
    mode: box
    unit_of_measurement: L
  detergent_scale:
    name: Detergent scale
    min: 0
    max: 5000
    step: 1
    mode: box
    unit_of_measurement: g
  dishwasher_energy:
    name: Dishwasher energy
    min: 0
    max: 100000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  # Counts each charging session from 0.
  carport_charger_session:
    name: Carport charger session energy
    min: 0
    max: 200
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  irrigation_water:
    name: Garden valve water
    min: 0
    max: 1000000
    step: 0.1
    mode: box
    unit_of_measurement: L
  wall_connector_energy:
    name: Wall Connector energy
    min: 0
    max: 1000000
    step: 0.001
    mode: box
    unit_of_measurement: kWh
  # The plugs of the static stand-ins' printers.
  anycubic_kobra_power:
    name: Anycubic Kobra S1 power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W
  p1s_power:
    name: P1S power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W
  core_one_power:
    name: Prusa Core One power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W
  octoprint_power:
    name: OctoPrint power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W
  k1c_power:
    name: K1C power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W
  centauri_carbon_power:
    name: Centauri Carbon power
    min: 0
    max: 2000
    step: 1
    mode: box
    unit_of_measurement: W

# The metering plugs, which Quick Start offers as meters.
template:
  - sensor:
      - name: Kobra S1 plug power
        unique_id: kobra_plug_power
        state: "{{ states('input_number.kobra_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Voron 2.4 plug power
        unique_id: voron_plug_power
        state: "{{ states('input_number.voron_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Washing machine plug energy
        unique_id: washer_plug_energy
        state: "{{ states('input_number.washer_energy') }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Dishwasher plug energy
        unique_id: dishwasher_plug_energy
        state: "{{ states('input_number.dishwasher_energy') }}"
        unit_of_measurement: kWh
        device_class: energy
        state_class: total_increasing
      - name: Anycubic Kobra S1 plug power
        unique_id: anycubic_kobra_plug_power
        state: "{{ states('input_number.anycubic_kobra_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: P1S plug power
        unique_id: p1s_plug_power
        state: "{{ states('input_number.p1s_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Prusa Core One plug power
        unique_id: core_one_plug_power
        state: "{{ states('input_number.core_one_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: OctoPrint plug power
        unique_id: octoprint_plug_power
        state: "{{ states('input_number.octoprint_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: K1C plug power
        unique_id: k1c_plug_power
        state: "{{ states('input_number.k1c_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement
      - name: Centauri Carbon plug power
        unique_id: centauri_carbon_plug_power
        state: "{{ states('input_number.centauri_carbon_power') }}"
        unit_of_measurement: W
        device_class: power
        state_class: measurement

# A camera without hardware, for a Device's Snapshot: ffmpeg's test picture.
camera:
  - platform: ffmpeg
    name: Workshop camera
    input: -f lavfi -i testsrc=size=640x360:rate=1
