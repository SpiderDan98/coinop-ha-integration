[project]
name = "coinop-ha-integration"
version = "0.0.0"
description = "Development environment for the Coin-op Home Assistant integration"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.375",
    "fpdf2==2.9.0",
    "Pillow==12.3.0",
    # Reads the Cost Statement PDF's text.
    "pypdf==6.21.4",
    # The camera integration's requirement, for the fake camera.
    "PyTurboJPEG==1.8.3",
]
lint = [
    "ruff==0.17.4",
    "mypy==2.4.1",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TID"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.coinop"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components", "dev", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# HA components re-export their API (websocket_api, http) by plain import.
module = ["homeassistant.components.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# Asserting a state change after an awaited call trips strict_equality's narrowing.
module = ["tests.*"]
strict_equality = false
