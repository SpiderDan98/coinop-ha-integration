[project]
name = "coinop-ha-integration"
version = "0.0.0"
description = "Development environment for the Coin-op Home Assistant integration"
requires-python = ">=3.14.2"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.375",
    "fpdf2==2.9.0",
    "Pillow==12.3.0",
    # Reads the Cost Statement PDF's text.
    "pypdf==6.21.4",
    # The camera integration's requirement, for the fake camera.
    "PyTurboJPEG==1.8.3",
]
lint = [
    "ruff==0.17.4",
    "mypy==2.4.1",
]
# Drives the installed Chrome for scripts/screenshots.py, so needs no browser download.
screenshots = [
    "playwright==1.64.1",
    # Renders the Cost Statement PDF's first page as an image.
    "pypdfium2==4.30.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "screenshots" },
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "TID"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# A stand-in imports its base from the sibling it is mounted next to.
"dev/*/{__init__,config_flow,camera}.py" = ["TID252"]
# Mounted under another name in the container, as is the package around it.
"dev/coinop_dev/scenarios/*.py" = ["TID252"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components.coinop"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
files = ["custom_components", "dev", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# HA components re-export their API (websocket_api, http) by plain import.
module = ["homeassistant.components.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
# Asserting a state change after an awaited call trips strict_equality's narrowing.
module = ["tests.*"]
strict_equality = false
