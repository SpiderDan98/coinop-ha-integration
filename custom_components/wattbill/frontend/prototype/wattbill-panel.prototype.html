<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WattBill panel prototype</title>
<!--
  PROTOTYPE, throwaway. Answers the wayfinder ticket "Panel prototype: Run list and Run detail view".
  Plan: three structurally different variants of the WattBill panel (Run list, Run detail, catalogues, analysis),
  switchable via ?variant=A|B|C or the arrow keys. Stub data in memory, no backend, nothing persists.
  Built with plain Lit + HA theme variables, no ha-* elements, matching the panel research.
-->
<style>
:root{
  --primary-color:#03a9f4; --primary-background-color:#fafafa; --secondary-background-color:#ededed;
  --card-background-color:#fff; --primary-text-color:#212121; --secondary-text-color:#727272;
  --divider-color:rgba(0,0,0,.12); --error-color:#db4437; --warning-color:#ffa600; --success-color:#43a047;
  --sidebar-background-color:#fff; --hover:rgba(0,0,0,.04); --selected:rgba(3,169,244,.12);
  --manual-color:#7e57c2; --elec:#f9a825; --mat:#26a69a; --other:#7e57c2;
}
@media (prefers-color-scheme: dark){
  :root{
    --primary-background-color:#111; --secondary-background-color:#262626; --card-background-color:#1c1c1c;
    --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b; --divider-color:rgba(225,225,225,.12);
    --sidebar-background-color:#1c1c1c; --hover:rgba(255,255,255,.05); --selected:rgba(3,169,244,.2); --manual-color:#b39ddb;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:Roboto,"Segoe UI",system-ui,sans-serif;font-size:14px;background:var(--primary-background-color);color:var(--primary-text-color)}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:6px;padding:6px 8px;min-width:0}
input:disabled,select:disabled{opacity:.6}
textarea{resize:vertical;min-height:52px}
h1{font-size:22px;margin:0 0 6px;font-weight:500} h2{font-size:18px;margin:0;font-weight:500} h3{font-size:15px;margin:0;font-weight:500}
.spacer{flex:1}.grow{flex:1;min-width:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.strong{font-weight:500}.muted{color:var(--secondary-text-color)}.small{font-size:12px}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right;font-variant-numeric:tabular-nums}
.warn{color:var(--warning-color)}
.link{color:var(--primary-color);cursor:pointer;background:none;border:0;padding:0}

/* HA chrome mock */
.ha{display:grid;grid-template-columns:56px 1fr;min-height:100vh}
.ha-side{background:var(--sidebar-background-color);border-right:1px solid var(--divider-color);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:4px;position:sticky;top:0;height:100vh}
.ha-item{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--secondary-text-color);font-size:17px}
.ha-item.on{background:var(--selected);color:var(--primary-color);font-weight:700}
.ha-main{min-width:0;display:flex;flex-direction:column}
.ha-toolbar{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--divider-color);background:var(--primary-background-color);position:sticky;top:0;z-index:5}
.ha-toolbar .ttl{font-size:20px}
.page{padding:16px 24px 120px;max-width:1400px;width:100%}

.btn{border:1px solid var(--divider-color);background:var(--card-background-color);border-radius:18px;padding:6px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover)} .btn.primary{background:var(--primary-color);color:#fff;border-color:transparent}
.btn.danger{color:var(--error-color)} .btn.sm{padding:3px 10px;font-size:12px} .btn.on{background:var(--selected);border-color:var(--primary-color)}
.icon{border:0;background:none;cursor:pointer;padding:2px 5px;border-radius:6px;color:var(--secondary-text-color);font-size:14px}
.icon:hover{background:var(--hover)} .icon.manual{color:var(--manual-color);font-weight:700} .icon.star.on{color:var(--warning-color)}
.card{background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px;padding:16px}
.card.flush{padding:0;overflow:auto}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;background:var(--secondary-background-color);color:var(--secondary-text-color);margin-left:4px;vertical-align:1px}
.tag.manual{background:color-mix(in srgb,var(--manual-color) 18%,transparent);color:var(--manual-color)}
.tag.live{background:color-mix(in srgb,var(--primary-color) 18%,transparent);color:var(--primary-color)}
.tag.sp{background:color-mix(in srgb,var(--mat) 20%,transparent);color:var(--mat)}
.oc{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.oc.Completed{background:color-mix(in srgb,var(--success-color) 16%,transparent);color:var(--success-color)}
.oc.Failed{background:color-mix(in srgb,var(--error-color) 16%,transparent);color:var(--error-color)}
.oc.Cancelled{background:var(--secondary-background-color);color:var(--secondary-text-color)}
.oc.Unknown{background:color-mix(in srgb,var(--warning-color) 18%,transparent);color:#b77900}
.oc.open{background:color-mix(in srgb,var(--primary-color) 16%,transparent);color:var(--primary-color);animation:pulse 2s infinite}
@keyframes pulse{50%{opacity:.55}}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.Completed{background:var(--success-color)}.dot.Failed{background:var(--error-color)}.dot.Cancelled{background:var(--secondary-text-color)}.dot.Unknown{background:var(--warning-color)}.dot.open{background:var(--primary-color);animation:pulse 2s infinite}
.flagdot{color:var(--warning-color);font-size:12px}
.swatch{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--divider-color);vertical-align:-2px}
.thumb{border-radius:6px;object-fit:cover;background:var(--secondary-background-color);display:block}
.thumb.xs{width:40px;height:30px}.thumb.sm{width:56px;height:42px}
.noimg{display:grid;place-items:center;color:var(--secondary-text-color);font-size:11px;background:var(--secondary-background-color);border-radius:6px}

table.tbl{width:100%;border-collapse:collapse}
.tbl th{font-weight:500;font-size:12px;color:var(--secondary-text-color);text-align:left;padding:8px 10px;border-bottom:1px solid var(--divider-color);white-space:nowrap}
.tbl td{padding:7px 10px;border-bottom:1px solid var(--divider-color);vertical-align:middle}
.tbl tfoot td{border-bottom:0}
.tbl tbody tr:hover{background:var(--hover)}
.tbl tr.sel{background:var(--selected)} .tbl tr.active{box-shadow:inset 3px 0 var(--primary-color)}
.tbl tr.dim{opacity:.55}
.tbl .cb{width:34px}
.runs tbody tr{cursor:pointer}
input.bare{border-color:transparent;background:transparent;width:100%;padding:4px 6px}
input.bare:hover:not(:disabled){border-color:var(--divider-color)} input.bare:focus{border-color:var(--primary-color);background:var(--card-background-color)}
input.bare.num{text-align:right}
.li td{padding:5px 6px}
.li tr.manual td:first-child{box-shadow:inset 3px 0 var(--manual-color)}
.li tr.locked input{color:var(--secondary-text-color)}
.evid{font-size:11px;color:var(--secondary-text-color);padding:0 6px}
.acts{white-space:nowrap;text-align:right}
.hint{font-size:12px;color:#b77900;background:color-mix(in srgb,var(--warning-color) 12%,transparent);padding:6px 10px;border-radius:6px;margin:6px 0}

.flags{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.flag{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--warning-color) 12%,transparent);font-size:13px}
.flag .t{flex:1}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--divider-color);border-radius:14px;padding:3px 10px;font-size:12px;cursor:pointer;background:var(--card-background-color)}
.chip.on{background:var(--selected);border-color:var(--primary-color);color:var(--primary-color)}
.seg{display:inline-flex;border:1px solid var(--divider-color);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--selected);color:var(--primary-color);font-weight:500}
.addform{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px dashed var(--divider-color);border-radius:10px;margin-top:10px}
.addform .row > input, .addform .row > select{flex:1}
.sec-head{display:flex;align-items:center;gap:8px;margin:8px 0 12px}
details.arch{margin-top:12px} details.arch summary{cursor:pointer;color:var(--secondary-text-color);margin-bottom:8px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-bottom:12px}
label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--secondary-text-color)}
label > input, label > select, label > textarea, label > .row{color:var(--primary-text-color);font-size:14px}
label.check{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--primary-text-color)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.span2{grid-column:span 2}
.grid2 > *{min-width:0} label > input, label > select, label > textarea{width:100%}

/* dialogs, toast, switcher */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:grid;place-items:center;z-index:50;padding:16px}
.dialog{background:var(--card-background-color);border-radius:16px;width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.dialog h2{padding:18px 20px 8px}.dbody{padding:4px 20px 12px;overflow:auto;display:flex;flex-direction:column;gap:10px}.dfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 20px;border-top:1px solid var(--divider-color)}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums;padding:8px 0;border-top:1px solid var(--divider-color)}
.totals .big{font-size:16px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#323232;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;max-width:90vw;font-size:13px}
.switcher{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:70;display:flex;align-items:center;gap:4px;background:#111;color:#fff;border-radius:22px;padding:5px;box-shadow:0 4px 18px rgba(0,0,0,.35);font-size:13px;border:2px solid #ff4081}
.switcher button{background:#333;color:#fff;border:0;border-radius:16px;padding:5px 11px;cursor:pointer}
.switcher .lbl{padding:0 10px;white-space:nowrap}
.statepane{position:fixed;left:50%;transform:translateX(-50%);bottom:62px;z-index:70;background:#111;color:#9fe39f;font:11px/1.4 ui-monospace,monospace;padding:10px 12px;border-radius:10px;max-height:40vh;overflow:auto;width:min(560px,92vw);white-space:pre-wrap}

/* Variant A: table + drawer */
.a-tabs{display:flex;gap:2px;padding:0 16px;border-bottom:1px solid var(--divider-color);background:var(--primary-background-color);position:sticky;top:56px;z-index:4}
.a-tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--secondary-text-color)}
.a-tabs button.on{border-color:var(--primary-color);color:var(--primary-color)}
.selbar{position:sticky;bottom:64px;margin-top:12px;display:flex;align-items:center;gap:10px;background:var(--primary-color);color:#fff;padding:10px 16px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.selbar .btn{background:#fff;color:var(--primary-color)}
.drawer{position:fixed;right:0;top:56px;bottom:0;width:min(620px,100%);background:var(--card-background-color);border-left:1px solid var(--divider-color);box-shadow:-6px 0 24px rgba(0,0,0,.12);overflow:auto;padding:14px 18px 90px;z-index:20}
.dhead{display:flex;gap:8px;align-items:center}
.title-in{font-size:20px;border-color:transparent;flex:1;padding:4px 6px}.title-in:hover{border-color:var(--divider-color)}
.imgstrip{display:flex;gap:8px;margin:10px 0;align-items:flex-end;flex-wrap:wrap}
.imgstrip figure{margin:0;text-align:center;font-size:10px;color:var(--secondary-text-color)}
.imgstrip img{width:96px;height:72px}
.a-an{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}

/* Variant B: rail + split + dialogs */
.b-wrap{display:grid;grid-template-columns:76px 1fr;flex:1;min-height:0}
.b-rail{border-right:1px solid var(--divider-color);display:flex;flex-direction:column;gap:2px;padding:8px 6px;position:sticky;top:56px;height:calc(100vh - 56px)}
.b-rail button{border:0;background:none;border-radius:12px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--secondary-text-color)}
.b-rail button span{font-size:18px}.b-rail button.on{background:var(--selected);color:var(--primary-color)}
.b-split{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 56px)}
.b-list{border-right:1px solid var(--divider-color);display:flex;flex-direction:column;min-height:0}
.b-listhead{display:flex;gap:6px;padding:10px}.b-listhead .search{flex:1;border-radius:18px}
.b-list .chips{padding:0 10px 8px}
.b-scroll{overflow:auto;flex:1}
.b-month{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:12px 12px 4px;font-size:12px;color:var(--secondary-text-color);position:sticky;top:0;background:var(--primary-background-color);font-weight:500}
.b-item{display:flex;gap:10px;align-items:center;padding:8px 12px;cursor:pointer;border-left:3px solid transparent}
.b-item:hover{background:var(--hover)}.b-item.active{background:var(--selected);border-left-color:var(--primary-color)}.b-item.sel{background:var(--selected)}
.b-item .right{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.b-listfoot{border-top:1px solid var(--divider-color);padding:10px 12px 64px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b-detail{overflow:auto;padding:20px 28px 100px}
.b-hero{display:grid;grid-template-columns:minmax(220px,340px) 1fr;gap:24px}
.b-gallery > img,.b-gallery > .noimg{width:100%;aspect-ratio:4/3;border-radius:12px;object-fit:cover}
.b-thumbs{display:flex;gap:6px;margin-top:6px;align-items:center;flex-wrap:wrap}.b-thumbs img{width:48px;height:36px;border-radius:5px;cursor:pointer;opacity:.6;object-fit:cover}.b-thumbs img.on{opacity:1;outline:2px solid var(--primary-color)}
.b-facts dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0}.b-facts dt{color:var(--secondary-text-color)}.b-facts dd{margin:0}
.note{font-style:italic;color:var(--secondary-text-color);margin:4px 0 10px}
.b-lines{max-width:720px;margin-top:18px;background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px;padding:8px 0}
.b-line{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-left:3px solid transparent}
.b-line:hover{background:var(--hover)}.b-line.manual{border-left-color:var(--manual-color)}
.b-line .amt{font-variant-numeric:tabular-nums;font-weight:500}
.b-add{display:block;width:calc(100% - 32px);margin:6px 16px;border:1px dashed var(--divider-color);background:none;border-radius:8px;padding:8px;cursor:pointer;color:var(--primary-color)}
.b-sum{border-top:2px dashed var(--divider-color);margin:8px 16px 4px;padding-top:10px}
.b-sum > div{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}.b-sum b{font-size:20px}
.b-ins{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;overflow:auto}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar .track{height:10px;background:var(--secondary-background-color);border-radius:5px;overflow:hidden;display:flex}
.bar .fill{height:100%}
.legend{display:flex;gap:12px;font-size:12px;color:var(--secondary-text-color);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Variant C: overview + pages + edit mode */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px;padding:14px}
.kpi .v{font-size:24px;font-weight:500;margin-top:4px;font-variant-numeric:tabular-nums}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:var(--primary-color)}
.c-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px;margin-bottom:20px}
.chart{display:flex;gap:18px;align-items:flex-end;height:170px;padding:10px 4px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;height:100%;justify-content:flex-end}
.chart .stack{width:100%;max-width:70px;display:flex;flex-direction:column-reverse;border-radius:6px 6px 0 0;overflow:hidden}
.chart .col.on .stack{outline:2px solid var(--primary-color)}
.chart .col small{color:var(--secondary-text-color)}
.live{border-color:var(--primary-color)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tile{background:var(--card-background-color);border:1px solid var(--divider-color);border-radius:12px;overflow:hidden;cursor:pointer;position:relative}
.tile:hover{border-color:var(--primary-color)}.tile.sel{outline:3px solid var(--primary-color)}
.timg{position:relative}.timg img,.timg .noimg{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;border-radius:0}
.tcb{position:absolute;top:8px;left:8px;background:var(--card-background-color);border-radius:6px;padding:3px;display:block}
.tflag{position:absolute;top:8px;right:8px;background:var(--warning-color);color:#000;border-radius:10px;padding:1px 7px;font-size:11px}
.tbody{padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.basket{position:fixed;right:20px;bottom:70px;z-index:30;background:var(--card-background-color);border:2px solid var(--primary-color);border-radius:14px;padding:12px 14px;box-shadow:0 6px 22px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px;min-width:260px}
.c-runbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.c-grid{display:grid;grid-template-columns:340px 1fr;gap:18px;align-items:start}
.c-left img.big,.c-left .noimg{width:100%;aspect-ratio:4/3;border-radius:10px;object-fit:cover}
.c-left dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px}.c-left dt{color:var(--secondary-text-color)}.c-left dd{margin:0}
.c-right{display:flex;flex-direction:column;gap:12px}
.c-ghead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.c-ghead h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px;background:var(--k)}
.ledger td{border-bottom:1px dotted var(--divider-color)}
.c-total{display:grid;grid-template-columns:1fr auto;gap:4px 16px;font-variant-numeric:tabular-nums}.c-total .big{font-size:22px;font-weight:600}
.editing .card{border-color:var(--primary-color)}
.banner{background:var(--selected);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:13px}
</style>
</head>
<body>
<wattbill-prototype></wattbill-prototype>
<script type="module">
import { LitElement, html, nothing } from 'https://cdn.jsdelivr.net/npm/lit@3.2.1/+esm';

// ---------- formatting ----------
const H = 3600e3, MIN = 60e3, TODAY = '2026-11-19';
const eur = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' });
const eur4 = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 4 });
const money = n => eur.format(n), money4 = n => eur4.format(n);
const r1 = n => Math.round(n * 10) / 10, r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const num = (n, d = 2) => n == null ? '—' : (+n).toLocaleString('en-IE', { maximumFractionDigits: d });
const fmtIn = (v, d) => v == null ? '' : String(+(+v).toFixed(d));
const fmtDate = d => d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
const fmtDT = d => d.toLocaleString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
const fmtDur = h => `${Math.floor(h)}h ${String(Math.round((h % 1) * 60)).padStart(2, '0')}m`;
const toLocalInput = d => new Date(d.getTime() - d.getTimezoneOffset() * MIN).toISOString().slice(0, 16);
const monthKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
const monthLabel = k => new Date(k + '-01T00:00').toLocaleDateString('en-GB', { month: 'long', year: 'numeric' });
const cls = o => Object.entries(o).filter(([, v]) => v).map(([k]) => k).join(' ');
const qtyDigits = u => ({ kWh: 3, g: 1, h: 2, pcs: 0 })[u] ?? 2;
let seq = 100; const uid = p => p + (++seq);
const up = () => document.querySelector('wattbill-prototype')?.requestUpdate();
const act = fn => e => { fn(e); up(); };

function dialogs() {
  const d = S.dialog;
  if (!d) return nothing;
  if (d.kind === 'statement') return statementDialog();
  if (d.kind === 'delete') return deleteDialog(d.ids);
  if (d.kind === 'new-run') return newRunDialog();
  if (d.kind === 'edit-li') return editLiDialog(d);
  if (d.kind === 'run-fields') return runFieldsDialog(d);
  if (d.kind === 'add-li') return modal('Add Line Item', addForm($run(d.runId), () => S.dialog = null), html`<button class="btn" @click=${close}>Close</button>`);
  return nothing;
}

          <small>${money(v.total)}</small><div class="stack" style="height:${v.total / maxM * 120}px">${KINDS.map(([kk, , c]) => html`<div style="height:${v.total ? v[kk] / v.total * 100 : 0}%;background:${c}"></div>`)}</div><small>${monthLabel(k).split(' ')[0]}</small></div>`)}</div>
        <div class="legend">${KINDS.map(([, l, c]) => html`<span><i style="background:${c}"></i>${l}</span>`)}</div></div>
      <div class="card"><h3>By Material</h3>${bars(all.byMat.map(([n, v]) => [n, [[v.cost, 'var(--mat)']], money(v.cost)]), Math.max(...all.byMat.map(([, v]) => v.cost), 0.01))}</div>
      ${live ? html`<div class="card live" style="cursor:pointer" @click=${act(() => cOpen(live))}><div class="row between"><h3>Running now</h3>${outcomeChip(live)}</div>
          <div class="row" style="margin-top:10px">${thumb(live, 'sm')}<div><div class="strong">${live.name}</div><div class="muted small">${$dev(live.deviceId).name} · ${fmtDur(runH(live))}</div></div></div>
          <div style="font-size:26px;margin-top:10px">${money(total(live))}</div><div class="muted small">provisional, updates live</div></div>`
        : html`<div class="card"><h3>By Outcome</h3>${bars(all.byOut.map(([o, v]) => [o, [[v.total, 'var(--primary-color)']], money(v.total)]), all.t.total)}</div>`}
    </div>
    <div class="sec-head"><h2>Runs</h2><span class="muted">${runs.length} · ${money(sumTotals(runs))}</span><div class="spacer"></div><button class="btn sm" @click=${act(() => selectAll(runs))}>Select all ended</button></div>
    <div class="filters">${filterSelects()}</div>
    <div class="gallery">${runs.map(r => html`<div class=${cls({ tile: 1, sel: S.sel.has(r.id) })} @click=${act(() => cOpen(r))}>
      <div class="timg">${r.images[0] ? html`<img src=${r.images[0].src} alt="">` : html`<div class="noimg">no image</div>`}
        ${isOpen(r) ? nothing : html`<label class="tcb" @click=${e => e.stopPropagation()}><input type="checkbox" .checked=${S.sel.has(r.id)} @change=${act(() => toggleSel(r))}></label>`}
        ${openFlags(r).length ? html`<span class="tflag">⚑ ${openFlags(r).length}</span>` : nothing}</div>
      <div class="tbody"><div class="strong ell">${r.name}</div><div class="muted small">${$dev(r.deviceId).name} · ${fmtDate(r.start)} · ${fmtDur(runH(r))}</div>
        <div class="row between">${outcomeChip(r)}<b>${money(total(r))}</b></div>
        ${r.partCount > 1 ? html`<div class="muted small">${money(perPart(r))} per part × ${r.partCount}</div>` : nothing}</div></div>`)}</div>`;
}
function cBasket() {
  const rs = statementRuns();
  return html`<div class="basket"><div class="row between"><b>🧾 ${rs.length} Runs</b><b>${money(sumTotals(rs))}</b></div>
    <div class="muted small ell" style="max-width:260px">${rs.map(r => r.name).join(', ')}</div>
    <div class="row"><button class="btn primary sm" @click=${act(() => S.dialog = { kind: 'statement' })}>Cost Statement…</button><button class="btn sm danger" @click=${act(() => S.dialog = { kind: 'delete', ids: [...S.sel] })}>Delete</button><button class="link small" @click=${act(() => S.sel.clear())}>clear</button></div></div>`;
}
const cOpen = r => { U.C.page = 'run'; U.C.id = r.id; U.C.draft = null; U.C.addKind = null; window.scrollTo(0, 0); };
function cSave() {
  const i = S.runs.findIndex(r => r.id === U.C.id), delta = r2(total(U.C.draft) - total(S.runs[i]));
  S.runs[i] = U.C.draft; U.C.draft = null;
  toast(delta ? `Saved. The Device cost sensors change by ${delta > 0 ? '+' : ''}${money(delta)} now (in this month's statistics).` : 'Saved. No cost change.');
}
function cRun(orig) {
  const editing = !!U.C.draft, r = U.C.draft ?? orig, hint = splitHint(r);
  return html`<div class=${editing ? 'editing' : ''}>
    ${editing ? html`<div class="banner">Editing: changes apply when you save. Computed values you change become manual and can be reset.</div>` : nothing}
    <div class="c-runbar">${outcomeChip(r)}${r.manualRun ? html`<span class="tag">manual Run</span>` : nothing}<span class="muted">${$dev(r.deviceId).name} · ${fmtDT(r.start)}</span><div class="spacer"></div>
      ${editing ? html`<button class="btn" @click=${act(() => U.C.draft = null)}>Cancel</button><button class="btn primary" @click=${act(cSave)}>Save changes</button>`
        : html`${isOpen(r) ? html`<button class="btn" @click=${act(() => endRunNow(r))}>End Run now</button>` : nothing}<button class="btn danger" @click=${act(() => S.dialog = { kind: 'delete', ids: [r.id] })}>Delete</button><button class="btn primary" @click=${act(() => U.C.draft = structuredClone(orig))}>Edit</button>`}</div>
    <div class="c-grid">
      <div class="card c-left">${r.images[0] ? html`<img class="big" src=${r.images[0].src} alt="">` : html`<div class="noimg">No image</div>`}${imageStrip(r)}
        ${editing ? runFieldsGrid(r) : html`<h1>${r.name}</h1><dl><dt>Started</dt><dd>${fmtDT(r.start)}</dd><dt>Ended</dt><dd>${r.end ? fmtDT(r.end) : '—'}</dd>
          <dt>Running</dt><dd>${fmtDur(runH(r))}${r.pauseH ? ` (+${fmtDur(r.pauseH)} paused)` : ''}</dd><dt>Part Count</dt><dd>${r.partCount}</dd></dl>${r.note ? html`<p class="note">“${r.note}”</p>` : nothing}`}</div>
      <div class="c-right">${flagsBlock(r)}
        ${KINDS.map(([k, label, c]) => { const items = r.lineItems.filter(l => l.kind === k); return html`<div class="card c-group" style="--k:${c}">
          <div class="c-ghead"><h3>${label}</h3><b>${money(kindTotal(r, k))}</b></div>
          <table class="tbl ledger li"><tbody>${items.map(l => editing ? cLiEdit(r, l) : cLiView(r, l))}
            ${!items.length ? html`<tr><td class="muted small">none</td></tr>` : nothing}</tbody></table>
          ${k === 'material' && hint ? html`<div class="hint">⚖ ${hint}</div>` : nothing}
          ${editing && k !== 'electricity' ? (U.C.addKind === k ? addForm(r, () => U.C.addKind = null, k === 'material' ? ['material'] : ['template', 'manual'])
            : html`<button class="btn sm" style="margin-top:8px" @click=${act(() => { U.C.addKind = k; S.add = null; })}>+ Add ${k === 'material' ? 'Material' : 'Other item'}</button>`) : nothing}</div>`; })}
        <div class="card c-total"><span class="big">Total</span><span class="big">${money(total(r))}</span><span class="muted">Cost per part (${r.partCount})</span><span class="muted">${money(perPart(r))}</span></div></div></div></div>`;
}
function cLiView(r, l) {
  return html`<tr class=${cls({ manual: l.manual })}><td><div>${l.label}${l.manual ? html`<span class="tag manual" title=${computedText(l)}>edited</span>` : nothing}${locked(r, l) ? html`<span class="tag live">live</span>` : nothing}</div><div class="evid" style="padding:0">${l.evidence}</div></td>
    <td class="num small muted">${l.qty == null ? html`<span class="warn">qty missing</span>` : `${num(l.qty, qtyDigits(l.unit))} ${l.unit} × ${money4(l.unitPrice)}`}</td><td class="num" style="width:90px">${money(ramount(l))}</td></tr>`;
}
function cLiEdit(r, l) {
  const f = liInputs(r, l);
  return html`<tr class=${cls({ manual: l.manual, locked: locked(r, l) })}><td>${f.label}<div class="evid">${l.evidence}</div></td>
    <td style="width:90px">${f.qty}</td><td class="small" style="width:36px">${l.unit}</td><td style="width:100px">${f.price}</td><td style="width:96px">${f.amount}</td><td class="acts">${f.acts}</td></tr>`;
}
function cSettings() {
  return html`<div style="display:flex;flex-direction:column;gap:28px">${renderMaterials()}${renderTemplates()}${renderDevices()}</div>`;
}

// ---------- switcher, live ticker, element ----------
const VARIANTS = [['A', 'Tabs + table + drawer'], ['B', 'Rail + split view + dialogs'], ['C', 'Overview + gallery + pages']];
let current = new URLSearchParams(location.search).get('variant')?.toUpperCase();
if (!VARIANTS.some(v => v[0] === current)) current = 'A';
function go(delta) {
  const i = VARIANTS.findIndex(v => v[0] === current);
  current = VARIANTS[(i + delta + VARIANTS.length) % VARIANTS.length][0];
  try { const u = new URL(location.href); u.searchParams.set('variant', current); history.replaceState(null, '', u); } catch { /* file:// may refuse */ }
  window.scrollTo(0, 0); up();
}
function stateDump() {
  const sel = statementRuns(), focus = current === 'A' ? $run(U.A.openId) : current === 'B' ? $run(U.B.id) : U.C.draft ?? $run(U.C.id);
  return JSON.stringify({ variant: current, filters: S.filters, selection: { runs: sel.map(r => r.name), total: sumTotals(sel) }, dialog: S.dialog?.kind ?? null,
    focusedRun: focus && { name: focus.name, outcome: focus.outcome ?? 'in progress', partCount: focus.partCount, total: total(focus), openFlags: openFlags(focus).map(f => f.text),
      lineItems: focus.lineItems.map(l => ({ label: l.label, qty: l.qty, unit: l.unit, unitPrice: +l.unitPrice.toFixed(4), amount: ramount(l), manual: l.manual, locked: locked(focus, l) })) },
    editingDraft: !!U.C.draft, materials: S.materials.length, templates: S.templates.length }, null, 2);
}
function switcher() {
  const v = VARIANTS.find(x => x[0] === current);
  return html`${U.showState ? html`<pre class="statepane">${stateDump()}</pre>` : nothing}
    <div class="switcher"><button @click=${() => go(-1)}>◀</button><span class="lbl">${v[0]} · ${v[1]}</span><button @click=${() => go(1)}>▶</button>
      <button title="Show state" @click=${act(() => U.showState = !U.showState)}>{ }</button></div>`;
}
setInterval(() => {
  for (const r of S.runs) {
    if (!isOpen(r)) continue;
    r.liveH += 1 / 60;
    for (const l of r.lineItems) {
      if (!l.live) continue;
      if (l.kind === 'electricity') l.qty = +(l.qty + 0.11 / 60).toFixed(4);
      else if (l.kind === 'material') { l.lengthMm += 80; l.qty = r1(mmToG(l.lengthMm, $mat(l.materialId))); }
      else if (l.basis === 'running hours') l.qty = r2(r.liveH);
      if (l.computed) l.computed.qty = l.qty;
    }
  }
  up();
}, 2000);

class WattbillPrototype extends LitElement {
  createRenderRoot() { return this; }
  connectedCallback() {
    super.connectedCallback();
    addEventListener('keydown', e => {
      if (e.target.closest?.('input,textarea,select,[contenteditable]')) return;
      if (e.key === 'ArrowLeft') go(-1);
      if (e.key === 'ArrowRight') go(1);
    });
  }
  render() {
    return html`${current === 'A' ? renderA() : current === 'B' ? renderB() : renderC()}${dialogs()}${S.toast ? html`<div class="toast">${S.toast}</div>` : nothing}${switcher()}`;
  }
}
customElements.define('wattbill-prototype', WattbillPrototype);
</script>
</body>
